<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="18" height="18">
  <defs>
    <!-- Subtle Drop Shadow Filter for Depth -->
    <filter id="lowerLayerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- LAYER 1: LOWER REAR CARD (WHITE STROKE) -->
  <g filter="url(#lowerLayerShadow)">
    <rect x="136" y="96" width="220" height="290" rx="36" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>

  <!-- LAYER 2: UPPER FRONT CARD (WHITE STROKE) -->
  <rect x="196" y="166" width="220" height="290" rx="36" fill="none" stroke="#FFFFFF" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
</svg>
