<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- Drop Shadow Filter for Lower Layer -->
    <filter id="lowerLayerShadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.35" />
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#2563EB" flood-opacity="0.3" />
    </filter>
  </defs>

  <!-- Layer 1: Lower Rear Blue Document Card with Drop Shadow (No letters) -->
  <g filter="url(#lowerLayerShadow)">
    <rect x="136" y="96" width="220" height="290" rx="36" fill="none" stroke="#2563EB" stroke-width="36" stroke-linecap="round" stroke-linejoin="round" />
  </g>
</svg>
